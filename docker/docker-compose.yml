services:
  mysql:
    image: mysql:8.0
    container_name: hospital-ops-mysql
    restart: unless-stopped
    # lower_case_table_names=1: 로컬 native Windows MySQL은 테이블명을 대소문자 구분 없이
    # 저장한다(플랫폼 기본값). Hibernate의 SpringPhysicalNamingStrategy는 @Table(name="...")에
    # 대문자로 적힌 테이블명(예: ACCESS_POLICY_RULES)도 항상 소문자로 변환해 스키마 검증을
    # 수행하므로, 리눅스 컨테이너의 MySQL 기본값(0, 대소문자 구분)에서는 이 검증이
    # "missing table" 오류로 실패한다(직접 기동 검증으로 발견). 컨테이너를 로컬과 동일한
    # 대소문자 비구분 동작으로 맞춰 이 불일치를 제거한다.
    command: --lower-case-table-names=1
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hospital-ops-net

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: hospital-ops-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ENVELOPE_KEK: ${ENVELOPE_KEK}
    ports:
      - "8080:8080"
    healthcheck:
      # Phase 7.1(Actuator + Micrometer)에서 /actuator/health가 permitAll로 노출되도록
      # 도입 완료됨(SecurityConfig.java) — 인프라 헬스체크 용도로 이 엔드포인트를 사용한다.
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - hospital-ops-net

  prometheus:
    image: prom/prometheus:latest
    container_name: hospital-ops-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - hospital-ops-net

  grafana:
    image: grafana/grafana:latest
    container_name: hospital-ops-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - hospital-ops-net

  nginx:
    image: nginx:stable
    container_name: hospital-ops-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - hospital-ops-net

networks:
  hospital-ops-net:
    driver: bridge

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
