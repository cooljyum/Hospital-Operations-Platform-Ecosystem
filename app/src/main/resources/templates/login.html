<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/default :: head(title='로그인')}">
    <title>로그인</title>
</head>
<body class="hold-transition login-page">
<div class="login-box">
    <div class="login-logo">
        <b>Hospital</b>Ops Lab
    </div>
    <div class="card">
        <div class="card-body login-card-body">
            <p class="login-box-msg">계정으로 로그인하세요</p>

            <p th:if="${param.error}" class="text-danger">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </p>
            <p th:if="${param.logout}" class="text-success">
                로그아웃되었습니다.
            </p>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="input-group mb-3">
                    <input type="text" name="username" class="form-control" placeholder="아이디" required="required" />
                </div>
                <div class="input-group mb-3">
                    <input type="password" name="password" class="form-control" placeholder="비밀번호" required="required" />
                </div>
                <div class="row">
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary btn-block">로그인</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{layout/default :: scripts}"></th:block>
</body>
</html>
