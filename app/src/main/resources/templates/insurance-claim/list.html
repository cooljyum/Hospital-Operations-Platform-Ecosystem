<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/default :: head(title='보험청구 관리')}">
    <title>보험청구 관리</title>
</head>
<body>
<div class="emr-shell">
    <header th:replace="~{layout/default :: topnavbar}"></header>
    <aside th:replace="~{layout/default :: sidebar}"></aside>

    <main class="workspace">
        <div class="workspace-layout">
            <section class="dashboard-core">
                <header th:replace="~{layout/default :: page-heading(title='보험청구 관리', subtitle='합성 데모 보험청구 현황을 조회하고 관리합니다.', actionLabel='신규 청구', actionHref=@{/insurance-claim/new})}"></header>

                <section>
                    <div class="panel">
                        <div class="panel-header">
                            <strong>보험청구 목록 (<span th:text="${#lists.size(rows)}">0</span>건)</strong>
                        </div>
                        <div class="panel-scroll">
                            <table class="table table-hover text-nowrap">
                                <thead>
                                <tr>
                                    <th>환자번호</th>
                                    <th>환자명</th>
                                    <th>보험사명</th>
                                    <th>청구금액</th>
                                    <th>청구상태</th>
                                    <th>제출일시</th>
                                    <th>처리일시</th>
                                    <th>처리자</th>
                                    <th>수정</th>
                                    <th>삭제</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(rows)}">
                                    <td colspan="10" class="text-center text-muted">등록된 보험청구 정보가 없습니다.</td>
                                </tr>
                                <tr th:each="row : ${rows}">
                                    <td th:text="${row.syntheticPatientNo}">SYN-0001</td>
                                    <td th:text="${row.patientName}">홍길동</td>
                                    <td th:text="${row.insuranceClaim.insurerName}">데모보험</td>
                                    <td th:text="${row.insuranceClaim.claimAmount}">100000.00</td>
                                    <td th:text="${row.insuranceClaim.claimStatus}">SUBMITTED</td>
                                    <td th:text="${row.insuranceClaim.submittedAt}">2026-01-01T09:00</td>
                                    <td th:text="${row.insuranceClaim.processedAt} ?: '-'">-</td>
                                    <td th:text="${row.insuranceClaim.processedByUsername}">registrar</td>
                                    <td><a class="btn btn-sm btn-default" th:href="@{/insurance-claim/{id}/edit(id=${row.insuranceClaim.insuranceClaimId})}">수정</a></td>
                                    <td>
                                        <form method="post" th:action="@{/insurance-claim/{id}/delete(id=${row.insuranceClaim.insuranceClaimId})}">
                                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </section>

            <aside th:replace="~{layout/default :: ai-panel}"></aside>
        </div>
    </main>
</div>

<th:block th:replace="~{layout/default :: scripts}"></th:block>
</body>
</html>
