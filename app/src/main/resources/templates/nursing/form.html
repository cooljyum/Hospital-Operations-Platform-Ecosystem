<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/default :: head(title=${isEdit ? '간호 기록 수정' : '신규 간호 기록'})}">
    <title>간호 기록</title>
</head>
<body>
<div class="emr-shell">
    <header th:replace="~{layout/default :: topnavbar}"></header>
    <aside th:replace="~{layout/default :: sidebar}"></aside>

    <main class="workspace">
        <div class="workspace-layout">
            <section class="dashboard-core dashboard-core--compact">
                <header th:replace="~{layout/default :: page-heading(title=${isEdit ? '간호 기록 수정' : '신규 간호 기록'}, subtitle='환자번호는 화면용 식별자만 사용하며 간호사는 로그인 계정으로 기록됩니다.', actionLabel='목록으로', actionHref=@{/nursing})}"></header>

                <section>
                    <div class="panel">
                        <div class="panel-header">
                            <strong th:text="${isEdit} ? '간호 기록 수정' : '신규 간호 기록 등록'">신규 간호 기록 등록</strong>
                        </div>
                        <div class="panel-scroll">
                            <p th:if="${errorMessage}" class="text-danger" th:text="${errorMessage}">오류 메시지</p>
                            <form method="post" th:action="${isEdit} ? @{/nursing/{id}(id=${nursingRecordId})} : @{/nursing}">
                                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <div class="form-group">
                                    <label for="syntheticPatientNo">환자번호</label>
                                    <input type="text" class="form-control" id="syntheticPatientNo" name="syntheticPatientNo"
                                           th:value="${syntheticPatientNo}" th:readonly="${isEdit}" required="required" />
                                </div>
                                <div class="form-group">
                                    <label for="recordedAt">기록시각</label>
                                    <input type="datetime-local" class="form-control" id="recordedAt" name="recordedAt"
                                           th:value="${recordedAt != null ? #temporals.format(recordedAt, 'yyyy-MM-dd''T''HH:mm') : ''}" required="required" />
                                </div>
                                <div class="form-group">
                                    <label for="temperature">체온</label>
                                    <input type="number" class="form-control" id="temperature" name="temperature" min="0" step="0.1"
                                           th:value="${temperature}" />
                                </div>
                                <div class="form-group">
                                    <label for="bloodPressure">혈압</label>
                                    <input type="text" class="form-control" id="bloodPressure" name="bloodPressure" maxlength="20"
                                           placeholder="예: 120/80" th:value="${bloodPressure}" />
                                </div>
                                <div class="form-group">
                                    <label for="pulse">맥박</label>
                                    <input type="number" class="form-control" id="pulse" name="pulse" min="0" step="1"
                                           th:value="${pulse}" />
                                </div>
                                <div class="form-group">
                                    <label>간호사</label>
                                    <input type="text" class="form-control" value="로그인 계정으로 자동 기록됩니다." readonly="readonly" />
                                </div>
                                <div class="form-group">
                                    <label for="notes">메모</label>
                                    <textarea class="form-control" id="notes" name="notes" rows="4" maxlength="500"
                                              th:text="${notes}"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary" th:text="${isEdit} ? '수정 저장' : '기록 등록'">기록 등록</button>
                                <a th:href="@{/nursing}" class="btn btn-default ml-2">취소</a>
                            </form>
                        </div>
                    </div>
                </section>
            </section>

            <aside th:replace="~{layout/default :: ai-panel}"></aside>
        </div>
    </main>
</div>

<th:block th:replace="~{layout/default :: scripts}"></th:block>
</body>
</html>
