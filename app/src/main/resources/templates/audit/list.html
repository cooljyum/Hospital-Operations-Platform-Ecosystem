<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/default :: head(title='감사 로그 조회')}">
    <title>감사 로그 조회</title>
</head>
<body>
<div class="emr-shell">
    <header th:replace="~{layout/default :: topnavbar}"></header>
    <aside th:replace="~{layout/default :: sidebar}"></aside>

    <main class="workspace">
        <div class="workspace-layout">
            <section class="dashboard-core">
                <header th:replace="~{layout/default :: page-heading(title='감사 로그 조회', subtitle='ROLE_AUDITOR 전용 — 행위자·대상·기간으로 감사 이벤트를 조회합니다.', actionLabel='필터 초기화', actionHref=@{/audit/preview})}"></header>

                <section class="summary-grid">
                    <article th:replace="~{layout/default :: metric-card(iconKey='chart', label='조회 결과', value=${#lists.size(logs) + '건'}, description='현재 필터 기준')}"></article>
                    <article th:replace="~{layout/default :: metric-card(iconKey='alert', label='실패', value=${#lists.size(logs.?[!success]) + '건'}, description='resultCode 실패')}"></article>
                    <article th:replace="~{layout/default :: metric-card(iconKey='users', label='성공', value=${#lists.size(logs.?[success]) + '건'}, description='정상 처리')}"></article>
                    <article th:replace="~{layout/default :: metric-card(iconKey='card', label='마스킹 적용', value=${#lists.size(logs.?[masked]) + '건'}, description='식별정보 마스킹')}"></article>
                </section>

                <section>
                    <div class="panel">
                        <div class="panel-header">
                            <strong>필터</strong>
                        </div>
                        <div class="panel-scroll">
                            <form method="get" th:action="@{/audit/preview}" class="form-inline">
                                <div class="form-group mr-3 mb-2">
                                    <label for="actorUsername" class="mr-2">행위자</label>
                                    <input type="text" class="form-control" id="actorUsername"
                                           name="actorUsername" th:value="${actorUsername}"
                                           placeholder="예: physician" />
                                </div>
                                <div class="form-group mr-3 mb-2">
                                    <label for="targetPk" class="mr-2">대상 PK</label>
                                    <input type="text" class="form-control" id="targetPk"
                                           name="targetPk" th:value="${targetPk}"
                                           placeholder="예: 12345" />
                                </div>
                                <div class="form-group mr-3 mb-2">
                                    <label for="from" class="mr-2">시작일</label>
                                    <input type="date" class="form-control" id="from"
                                           name="from" th:value="${from}" />
                                </div>
                                <div class="form-group mr-3 mb-2">
                                    <label for="to" class="mr-2">종료일</label>
                                    <input type="date" class="form-control" id="to"
                                           name="to" th:value="${to}" />
                                </div>
                                <button type="submit" class="btn btn-primary mb-2">조회</button>
                                <a th:href="@{/audit/preview}" class="btn btn-default mb-2 ml-2">초기화</a>
                            </form>
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-header">
                            <strong>조회 결과 (<span th:text="${#lists.size(logs)}">0</span>건)</strong>
                        </div>
                        <div class="panel-scroll">
                            <table class="table table-hover text-nowrap">
                                <thead>
                                <tr>
                                    <th>시각</th>
                                    <th>행위자</th>
                                    <th>행위</th>
                                    <th>대상 PK</th>
                                    <th>목적</th>
                                    <th>마스킹</th>
                                    <th>결과 코드</th>
                                    <th>성공 여부</th>
                                    <th>IP</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(logs)}">
                                    <td colspan="9" class="text-center text-muted">조회된 감사 로그가 없습니다.</td>
                                </tr>
                                <tr th:each="log : ${logs}">
                                    <td th:text="${log.occurredAt}">2026-01-01T00:00:00</td>
                                    <td th:text="${log.actorUsername}">actor</td>
                                    <td th:text="${log.action}">ACTION</td>
                                    <td th:text="${log.targetPk} ?: '-'">-</td>
                                    <td th:text="${log.purpose} ?: '-'">-</td>
                                    <td th:text="${log.masked} ? '예' : '아니오'">아니오</td>
                                    <td th:text="${log.resultCode}">RESULT_CODE</td>
                                    <td>
                                        <span class="dot" th:classappend="${log.success} ? 'dot-success' : 'dot-danger'"></span>
                                        <span th:class="${log.success} ? 'text-success' : 'text-danger'"
                                              th:text="${log.success} ? '성공' : '실패'">성공</span>
                                    </td>
                                    <td th:text="${log.ipAddress} ?: '-'">-</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </section>

            <aside th:replace="~{layout/default :: ai-panel}"></aside>
        </div>
    </main>
</div>

<th:block th:replace="~{layout/default :: scripts}"></th:block>
</body>
</html>
