<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/default :: head(title='접수 관리')}">
    <title>접수 관리</title>
</head>
<body>
<div class="emr-shell">
    <header th:replace="~{layout/default :: topnavbar}"></header>
    <aside th:replace="~{layout/default :: sidebar}"></aside>

    <main class="workspace">
        <div class="workspace-layout">
            <section class="dashboard-core">
                <header th:replace="~{layout/default :: page-heading(title='접수 관리', subtitle='환자 접수 현황을 조회하고 관리합니다.', actionLabel='신규 접수', actionHref=@{/reception/new})}"></header>

                <section class="summary-grid">
                    <article th:replace="~{layout/default :: metric-card(iconKey='chart', label='전체 접수', value=${#lists.size(rows) + '건'}, description='현재 조회 기준')}"></article>
                    <article th:replace="~{layout/default :: metric-card(iconKey='users', label='대기', value=${#lists.size(rows.?[reception.status == 'WAITING']) + '건'}, description='접수 대기')}"></article>
                    <article th:replace="~{layout/default :: metric-card(iconKey='alert', label='진행중', value=${#lists.size(rows.?[reception.status == 'IN_PROGRESS']) + '건'}, description='진료 진행')}"></article>
                    <article th:replace="~{layout/default :: metric-card(iconKey='card', label='완료', value=${#lists.size(rows.?[reception.status == 'DONE']) + '건'}, description='접수 완료')}"></article>
                </section>

                <section>
                    <div class="panel">
                        <div class="panel-header">
                            <strong>접수 목록 (<span th:text="${#lists.size(rows)}">0</span>건)</strong>
                        </div>
                        <div class="panel-scroll">
                            <table class="table table-hover text-nowrap">
                                <thead>
                                <tr>
                                    <th>접수일시</th>
                                    <th>환자번호</th>
                                    <th>환자명</th>
                                    <th>주호소</th>
                                    <th>상태</th>
                                    <th>접수자</th>
                                    <th>수정</th>
                                    <th>삭제</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(rows)}">
                                    <td colspan="8" class="text-center text-muted">등록된 접수 정보가 없습니다.</td>
                                </tr>
                                <tr th:each="row : ${rows}">
                                    <td th:text="${row.reception.receivedAt}">2026-01-01T09:00</td>
                                    <td th:text="${row.syntheticPatientNo}">SYN-0001</td>
                                    <td th:text="${row.patientName}">홍길동</td>
                                    <td th:text="${row.reception.chiefComplaint} ?: '-'">-</td>
                                    <td th:text="${row.reception.status}">WAITING</td>
                                    <td th:text="${row.reception.receptionistUsername}">registrar</td>
                                    <td><a class="btn btn-sm btn-default" th:href="@{/reception/{id}/edit(id=${row.reception.receptionId})}">수정</a></td>
                                    <td>
                                        <form method="post" th:action="@{/reception/{id}/delete(id=${row.reception.receptionId})}">
                                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </section>

            <aside th:replace="~{layout/default :: ai-panel}"></aside>
        </div>
    </main>
</div>

<th:block th:replace="~{layout/default :: scripts}"></th:block>
</body>
</html>
