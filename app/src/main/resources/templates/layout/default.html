<!DOCTYPE html>
<!--
이 파일은 컨트롤러가 직접 렌더하지 않고, 다른 템플릿에서 th:replace로 아래 th:fragment 조각만
가져다 쓰는 "레이아웃 프래그먼트 저장소"다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} + ' | Hospital Ops Lab'">Hospital Ops Lab</title>

    <link rel="stylesheet" th:href="@{/adminlte/plugins/fontawesome-free/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/adminlte/plugins/bootstrap/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/adminlte/dist/css/adminlte.min.css}" />
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
</th:block>

<header th:fragment="topnavbar" class="topbar">
    <div class="topbar-brand">
        <button type="button" class="pushmenu-toggle" data-widget="pushmenu" aria-label="사이드바 열기 또는 닫기">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <span class="brand-symbol" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 6v12M6 12h12" />
            </svg>
        </span>
        <span class="brand-name">Hospital Ops Lab</span>
    </div>

    <div class="topbar-content">
        <div class="search-control">
            <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="6" />
                <path d="m16 16 4 4" />
            </svg>
            <!-- 검색 연결은 이후 단계에서 구현한다. -->
            <input type="search" placeholder="환자 검색 (이름, 등록번호, 전화번호)" aria-label="환자 검색" />
            <span class="search-shortcut">⌘K</span>
        </div>

        <div class="topbar-actions">
            <button type="button" class="topbar-wide-button">예약 —명</button>
            <button type="button" class="topbar-icon-button notification-button" aria-label="알림">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
                </svg>
                <span class="notification-badge">—</span>
            </button>
            <button type="button" class="topbar-icon-button" aria-label="다크모드 전환">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z" />
                </svg>
            </button>
            <button type="button" class="profile-control" aria-label="사용자 프로필">
                <span class="profile-avatar" aria-hidden="true"></span>
                <span class="profile-text">
                    <strong sec:authentication="name">username</strong>
                    <!-- 다중 역할은 아래 순서로 하나만 표시: 시스템 관리자, 감사관, 의사, 간호사, 접수 담당자. -->
                    <small sec:authorize="hasAuthority('ROLE_SYSTEM_ADMIN')">시스템 관리자</small>
                    <small sec:authorize="hasAuthority('ROLE_AUDITOR') and !hasAuthority('ROLE_SYSTEM_ADMIN')">감사관</small>
                    <small sec:authorize="hasAuthority('ROLE_PHYSICIAN') and !hasAnyAuthority('ROLE_SYSTEM_ADMIN', 'ROLE_AUDITOR')">의사</small>
                    <small sec:authorize="hasAuthority('ROLE_NURSE') and !hasAnyAuthority('ROLE_SYSTEM_ADMIN', 'ROLE_AUDITOR', 'ROLE_PHYSICIAN')">간호사</small>
                    <small sec:authorize="hasAuthority('ROLE_REGISTRAR') and !hasAnyAuthority('ROLE_SYSTEM_ADMIN', 'ROLE_AUDITOR', 'ROLE_PHYSICIAN', 'ROLE_NURSE')">접수 담당자</small>
                </span>
                <svg class="profile-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m6 9 6 6 6-6" />
                </svg>
            </button>
        </div>
    </div>
</header>

<aside th:fragment="sidebar" class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="#" class="brand-link">
        <span class="brand-text font-weight-light">Hospital Ops Lab</span>
    </a>
    <div class="sidebar">
        <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                <li class="nav-item">
                    <a href="/dashboard" class="nav-link active">
                        <i class="nav-icon fas fa-tachometer-alt"></i>
                        <p>대시보드</p>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('ROLE_AUDITOR')">
                    <a href="/audit/preview" class="nav-link">
                        <i class="nav-icon fas fa-clipboard-list"></i>
                        <p>감사 로그</p>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyAuthority('ROLE_AUDITOR', 'ROLE_SYSTEM_ADMIN')">
                    <a href="/reports/patient-visit-summary" class="nav-link">
                        <i class="nav-icon fas fa-chart-bar"></i>
                        <p>방문 요약 리포트</p>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyAuthority('ROLE_AUDITOR', 'ROLE_SYSTEM_ADMIN')">
                    <a href="/stats/patient-count-by-gender-age-band/view" class="nav-link">
                        <i class="nav-icon fas fa-chart-pie"></i>
                        <p>비식별 통계</p>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</aside>

<footer th:fragment="footer" class="main-footer">
    <div class="float-right d-none d-sm-inline">Hospital Ops Lab</div>
    <strong>&copy; 2026 Hospital Ops Lab.</strong> All rights reserved.
</footer>

<th:block th:fragment="scripts">
    <script th:src="@{/adminlte/plugins/jquery/jquery.min.js}"></script>
    <script th:src="@{/adminlte/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/adminlte/dist/js/adminlte.min.js}"></script>
</th:block>

</body>
</html>
