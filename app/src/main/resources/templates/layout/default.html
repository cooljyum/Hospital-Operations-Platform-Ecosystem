<!DOCTYPE html>
<!--
이 파일은 컨트롤러가 직접 렌더하지 않고, 다른 템플릿에서 th:replace로 아래 th:fragment 조각만
가져다 쓰는 "레이아웃 프래그먼트 저장소"다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} + ' | Hospital Ops Lab'">Hospital Ops Lab</title>

    <link rel="stylesheet" th:href="@{/adminlte/plugins/fontawesome-free/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/adminlte/plugins/bootstrap/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/adminlte/dist/css/adminlte.min.css}" />
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
</th:block>

<header th:fragment="topnavbar" class="topbar">
    <div class="topbar-brand">
        <button type="button" class="pushmenu-toggle" data-widget="pushmenu" aria-label="사이드바 열기 또는 닫기">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <span class="brand-symbol" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 6v12M6 12h12" />
            </svg>
        </span>
        <span class="brand-name">Hospital Ops Lab</span>
    </div>

    <div class="topbar-content">
        <div class="search-control">
            <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="6" />
                <path d="m16 16 4 4" />
            </svg>
            <!-- 검색 연결은 이후 단계에서 구현한다. -->
            <input type="search" placeholder="환자 검색 (이름, 등록번호, 전화번호)" aria-label="환자 검색" />
            <span class="search-shortcut">⌘K</span>
        </div>

        <div class="topbar-actions">
            <button type="button" class="topbar-wide-button">예약 —명</button>
            <button type="button" class="topbar-icon-button notification-button" aria-label="알림">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
                </svg>
                <span class="notification-badge">—</span>
            </button>
            <button type="button" class="topbar-icon-button" aria-label="다크모드 전환">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z" />
                </svg>
            </button>
            <button type="button" class="profile-control" aria-label="사용자 프로필">
                <span class="profile-avatar" aria-hidden="true"></span>
                <span class="profile-text">
                    <strong sec:authentication="name">username</strong>
                    <!-- 다중 역할은 아래 순서로 하나만 표시: 시스템 관리자, 감사관, 의사, 간호사, 접수 담당자. -->
                    <small sec:authorize="hasAuthority('ROLE_SYSTEM_ADMIN')">시스템 관리자</small>
                    <small sec:authorize="hasAuthority('ROLE_AUDITOR') and !hasAuthority('ROLE_SYSTEM_ADMIN')">감사관</small>
                    <small sec:authorize="hasAuthority('ROLE_PHYSICIAN') and !hasAnyAuthority('ROLE_SYSTEM_ADMIN', 'ROLE_AUDITOR')">의사</small>
                    <small sec:authorize="hasAuthority('ROLE_NURSE') and !hasAnyAuthority('ROLE_SYSTEM_ADMIN', 'ROLE_AUDITOR', 'ROLE_PHYSICIAN')">간호사</small>
                    <small sec:authorize="hasAuthority('ROLE_REGISTRAR') and !hasAnyAuthority('ROLE_SYSTEM_ADMIN', 'ROLE_AUDITOR', 'ROLE_PHYSICIAN', 'ROLE_NURSE')">접수 담당자</small>
                </span>
                <svg class="profile-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m6 9 6 6 6-6" />
                </svg>
            </button>
        </div>
    </div>
</header>

<aside th:fragment="sidebar" class="sidebar">
    <div class="sidebar-scroll">
        <section class="sidebar-section">
            <p class="sidebar-section-title">업무 메뉴</p>
            <nav class="sidebar-nav" aria-label="업무 메뉴">
                <a th:href="@{/dashboard}" class="sidebar-item">
                    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" /><rect x="14" y="4" width="6" height="6" /><rect x="4" y="14" width="6" height="6" /><rect x="14" y="14" width="6" height="6" /></svg>
                    <span>대시보드</span>
                </a>
                <a href="#" class="sidebar-item" sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','ROLE_AUDITOR')">
                    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h6M9 3h6v4H9zM6 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1" /><path d="m8 14 2 2 5-5" /></svg>
                    <span>접수</span>
                </a>
                <a href="#" class="sidebar-item" sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','ROLE_AUDITOR')">
                    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M7 3v4M17 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01" /></svg>
                    <span>예약</span>
                </a>
                <a href="#" class="sidebar-item" sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','ROLE_AUDITOR')">
                    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h11v18H4zM15 8h5v13h-5M8 12h3" /></svg>
                    <span>진료실</span>
                </a>
                <a href="#" class="sidebar-item" sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','ROLE_AUDITOR')">
                    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.9-8.6a5.5 5.5 0 0 0-.1-7.8Z" /><path d="M5.5 12h3l1.2-2.2 2.1 4.4 1.3-2.2h5" /></svg>
                    <span>간호</span>
                </a>
                <a href="#" class="sidebar-item" sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','ROLE_AUDITOR')">
                    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3 6 6v5.5a4.5 4.5 0 1 1-9 0V9l3-6Z" /><path d="M6 14h9" /></svg>
                    <span>검사</span>
                </a>
                <a href="#" class="sidebar-item" sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','ROLE_AUDITOR')">
                    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 10h18M7 15h3" /></svg>
                    <span>수납</span>
                </a>
                <a href="#" class="sidebar-item" sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','ROLE_AUDITOR')">
                    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18V9h18v9M5 18v3M19 18v3M3 13h18M7 9V6h5v3" /><path d="M14 15h3" /></svg>
                    <span>입원</span>
                </a>
                <a href="#" class="sidebar-item" sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','ROLE_AUDITOR')">
                    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 7.8 7 10 4-2.2 7-5.5 7-10V6l-7-3Z" /><path d="M9 12h6M9 16h4" /></svg>
                    <span>보험청구</span>
                </a>
                <a th:href="@{/stats/patient-count-by-gender-age-band/view}" class="sidebar-item" sec:authorize="hasAnyAuthority('ROLE_AUDITOR','ROLE_SYSTEM_ADMIN')">
                    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>
                    <span>통계</span>
                </a>
                <a th:href="@{/admin/system}" class="sidebar-item" sec:authorize="hasAuthority('ROLE_SYSTEM_ADMIN')">
                    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.2 2.2-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-3.2v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-2.2-2.2.1-.1A1.7 1.7 0 0 0 6.6 15a1.7 1.7 0 0 0-1.5-1H5v-3.2h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 2.2-2.2.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V4h3.2v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 2.2 2.2-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1Z" /></svg>
                    <span>설정</span>
                </a>
            </nav>
        </section>

        <section class="sidebar-section sidebar-favorites">
            <p class="sidebar-section-title">즐겨찾기</p>
            <nav class="sidebar-nav sidebar-nav-compact" aria-label="즐겨찾기">
                <a th:href="@{/audit/preview}" class="sidebar-item" sec:authorize="hasAuthority('ROLE_AUDITOR')">
                    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10v18H7zM10 8h4M10 12h4M10 16h3" /></svg>
                    <span>감사 로그</span>
                </a>
                <a th:href="@{/reports/patient-visit-summary}" class="sidebar-item" sec:authorize="hasAnyAuthority('ROLE_AUDITOR','ROLE_SYSTEM_ADMIN')">
                    <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V5M16 20v-8M22 20H2" /><path d="m5 8 4-3 4 2 6-4" /></svg>
                    <span>방문 요약 리포트</span>
                </a>
            </nav>
        </section>
    </div>

    <div class="sidebar-footer-block">
        <button type="button" class="sidebar-edit-button">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 20 4-1 10-10-3-3L5 16l-1 4Z" /><path d="m13 6 3 3" /></svg>
            <span>메뉴 편집</span>
        </button>
        <p class="sidebar-connection-status"><span class="dot dot-success"></span><span>정상 연결</span></p>
    </div>
</aside>

<footer th:fragment="footer" class="main-footer">
    <div class="float-right d-none d-sm-inline">Hospital Ops Lab</div>
    <strong>&copy; 2026 Hospital Ops Lab.</strong> All rights reserved.
</footer>

<th:block th:fragment="scripts">
    <script th:src="@{/adminlte/plugins/jquery/jquery.min.js}"></script>
    <script th:src="@{/adminlte/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/adminlte/dist/js/adminlte.min.js}"></script>
</th:block>

</body>
</html>
