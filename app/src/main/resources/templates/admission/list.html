<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/default :: head(title='입원 관리')}">
    <title>입원 관리</title>
</head>
<body>
<div class="emr-shell">
    <header th:replace="~{layout/default :: topnavbar}"></header>
    <aside th:replace="~{layout/default :: sidebar}"></aside>

    <main class="workspace">
        <div class="workspace-layout">
            <section class="dashboard-core">
                <header th:replace="~{layout/default :: page-heading(title='입원 관리', subtitle='환자 입원 현황을 조회하고 관리합니다.', actionLabel='신규 입원', actionHref=@{/admission/new})}"></header>

                <section class="summary-grid">
                    <article th:replace="~{layout/default :: metric-card(iconKey='chart', label='전체 입원', value=${#lists.size(rows) + '건'}, description='현재 조회 기준')}"></article>
                    <article th:replace="~{layout/default :: metric-card(iconKey='users', label='입원중', value=${#lists.size(rows.?[admission.status == 'ADMITTED']) + '건'}, description='입원 유지')}"></article>
                    <article th:replace="~{layout/default :: metric-card(iconKey='card', label='퇴원', value=${#lists.size(rows.?[admission.status == 'DISCHARGED']) + '건'}, description='퇴원 완료')}"></article>
                    <article th:replace="~{layout/default :: metric-card(iconKey='alert', label='전원', value=${#lists.size(rows.?[admission.status == 'TRANSFERRED']) + '건'}, description='전원 처리')}"></article>
                </section>

                <section>
                    <div class="panel">
                        <div class="panel-header">
                            <strong>입원 목록 (<span th:text="${#lists.size(rows)}">0</span>건)</strong>
                        </div>
                        <div class="panel-scroll">
                            <table class="table table-hover text-nowrap">
                                <thead>
                                <tr>
                                    <th>환자번호</th>
                                    <th>환자명</th>
                                    <th>병동</th>
                                    <th>병상</th>
                                    <th>입원일시</th>
                                    <th>퇴원일시</th>
                                    <th>사유</th>
                                    <th>상태</th>
                                    <th>입원처리자</th>
                                    <th>수정</th>
                                    <th>삭제</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(rows)}">
                                    <td colspan="11" class="text-center text-muted">등록된 입원 정보가 없습니다.</td>
                                </tr>
                                <tr th:each="row : ${rows}">
                                    <td th:text="${row.syntheticPatientNo}">SYN-0001</td>
                                    <td th:text="${row.patientName}">홍길동</td>
                                    <td th:text="${row.admission.ward}">3병동</td>
                                    <td th:text="${row.admission.bedNo}">301-A</td>
                                    <td th:text="${row.admission.admittedAt}">2026-01-01T09:00</td>
                                    <td th:text="${row.admission.dischargedAt} ?: '-'">-</td>
                                    <td th:text="${row.admission.reason} ?: '-'">-</td>
                                    <td th:text="${row.admission.status}">ADMITTED</td>
                                    <td th:text="${row.admission.admittedByUsername}">nurse</td>
                                    <td><a class="btn btn-sm btn-default" th:href="@{/admission/{id}/edit(id=${row.admission.admissionId})}">수정</a></td>
                                    <td>
                                        <form method="post" th:action="@{/admission/{id}/delete(id=${row.admission.admissionId})}">
                                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </section>

            <aside th:replace="~{layout/default :: ai-panel}"></aside>
        </div>
    </main>
</div>

<th:block th:replace="~{layout/default :: scripts}"></th:block>
</body>
</html>
