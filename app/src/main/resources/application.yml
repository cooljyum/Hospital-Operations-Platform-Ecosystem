server:
  port: 8080

spring:
  application:
    name: hospital-ops-lab

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital_ops}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:hospital_ops}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false

  # Phase 2 Step 2.1: Spring Batch 설정.
  # - job.enabled=false: Spring Boot의 JobLauncherApplicationRunner 자동 기동을 끈다.
  #   fhirSyncJob은 SyncJobRunner(batch 패키지)가 sync.job.enabled 프로퍼티를 보고
  #   명시적으로만 실행한다(평소 앱 기동/테스트에서 자동 실행되지 않게 하기 위함).
  # - jdbc.initialize-schema=never: BATCH_JOB_INSTANCE 등 메타데이터 스키마는
  #   V5__spring_batch_metadata_and_fhir_sync.sql(Flyway)이 유일하게 소유한다 —
  #   Boot의 자동 스키마 초기화와 중복 생성되지 않도록 막는다.
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

# Phase 1 Step 1.3: Synthea 산출 CSV -> 레거시 HIS 스키마 적재 배치 설정.
# 기본은 비활성 + 경로 미지정 — 평소 앱 기동/테스트에서 이 배치가 자동 실행되지 않도록
# 한다. data/ 디렉터리는 저장소 루트에만 있고 환경마다 있으리라는 보장이 없으므로
# 절대경로를 하드코딩하지 않고 프로퍼티/환경변수로 받는다.
synthea:
  loader:
    enabled: ${SYNTHEA_LOADER_ENABLED:false}
    csv-dir: ${SYNTHEA_LOADER_CSV_DIR:}

# Phase 2 Step 2.1: 레거시 HIS -> FHIR_RESOURCE_CACHE 증분 동기화 배치(fhirSyncJob) 설정.
# 기본은 비활성 — SyntheaLoader와 같은 "명시적 opt-in" 패턴.
sync:
  job:
    enabled: ${SYNC_JOB_ENABLED:false}
