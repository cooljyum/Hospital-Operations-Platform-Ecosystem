plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hospitalops'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	hapiFhirVersion = '8.10.0'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	// Phase 7 Step 7.1: Actuator + Micrometer(Prometheus) 메트릭 노출.
	// docker/prometheus/prometheus.yml이 이미 /actuator/prometheus를 스크레이프 대상으로
	// 잡아 두고 있었다(Phase 7.1 도입 전까지는 타겟 DOWN이 "예상된 동작"이라는 주석과 함께).
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// HAPI FHIR R4 구조체 라이브러리 (Phase 2 FHIR 변환 계층에서 사용)
	implementation "ca.uhn.hapi.fhir:hapi-fhir-structures-r4:${hapiFhirVersion}"
	// Phase 2 Step 2.3: FhirValidator(구조/인스턴스 검증)에 필요.
	// hapi-fhir-validation-resources-r4는 DefaultProfileValidationSupport가 참조하는
	// R4 기본 StructureDefinition/ValueSet 리소스 번들을 제공한다(전체 프로파일 검증이
	// 아니라 기본 R4 인스턴스 검증 수준으로만 쓴다 — PLAN.md 지시대로 "과함" 방지).
	testImplementation "ca.uhn.hapi.fhir:hapi-fhir-validation:${hapiFhirVersion}"
	testImplementation "ca.uhn.hapi.fhir:hapi-fhir-validation-resources-r4:${hapiFhirVersion}"
	// HAPI-2200: ValidationSupportChain이 캐시 서비스 프로바이더를 요구한다(caffeine 기본).
	testImplementation "ca.uhn.hapi.fhir:hapi-fhir-caching-caffeine:${hapiFhirVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.batch:spring-batch-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Phase 4 Step 4.2: EnvelopeCrypto 빈은 ENVELOPE_KEK(app.crypto.envelope.kek)가
	// 없으면 생성자에서 실패해 Spring 컨텍스트 기동 자체를 막는다(의도된 동작). 기존
	// *IT/*Tests 다수가 전체 컨텍스트를 띄우므로, 테스트 실행 JVM에만 이 환경변수를
	// 전역으로 넣어준다 - 운영 기동 경로(이 test 태스크 밖)에는 영향이 없다. 이 값은
	// 테스트 전용 무작위 32바이트 Base64 키이며 운영 키가 아니다.
	environment 'ENVELOPE_KEK', 'rr2eepXZ4AA789ddoyNv9PRxX0u/Pn8x24YkVbFvcGE='
}
